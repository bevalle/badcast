<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BadCast – Écran</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; cursor: none; }
  .layer {
    position: absolute; inset: 0; width: 100%; height: 100%;
    object-fit: contain; opacity: 0; transition: opacity .8s ease;
  }
  body.cover .layer { object-fit: cover; }
  body.no-fade .layer { transition: none; }
  .layer.visible { opacity: 1; }
  #message {
    position: absolute; left: 0; right: 0; bottom: 0; padding: 1.2vh 3vw;
    background: rgba(0,0,0,.7); color: #fff; font: 600 4vh/1.3 system-ui, sans-serif;
    text-align: center; display: none;
  }
  #status {
    position: absolute; top: 12px; right: 12px; padding: 6px 12px; border-radius: 6px;
    background: #b00020; color: #fff; font: 14px system-ui, sans-serif; display: none;
  }
  #hint {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    color: #888; font: 3vh system-ui, sans-serif; text-align: center; cursor: pointer;
  }
</style>
</head>
<body>
<img class="layer" id="a" alt="">
<img class="layer" id="b" alt="">
<div id="message"></div>
<div id="status">Connexion au PC maître perdue… reconnexion</div>
<div id="hint">En attente du PC maître…<br><small>Cliquez ou appuyez sur F11 pour le plein écran</small></div>

<script>
(() => {
  const params = new URLSearchParams(location.search);
  if (params.get('fit') === 'cover') document.body.classList.add('cover');

  const layers = [document.getElementById('a'), document.getElementById('b')];
  const msg = document.getElementById('message');
  const status = document.getElementById('status');
  const hint = document.getElementById('hint');
  let front = 0;
  let shownSrc = null;
  let wantedSrc = null;
  const cache = new Map(); // src -> Image préchargée

  function preload(src) {
    if (!src || cache.has(src)) return cache.get(src);
    const img = new Image();
    img.decoding = 'async';
    const p = new Promise((ok) => { img.onload = img.onerror = () => ok(img); });
    img.src = src;
    const entry = { img, ready: p.then(() => img.decode ? img.decode().catch(() => {}) : null) };
    cache.set(src, entry);
    // limite la mémoire : on garde les 6 dernières images
    if (cache.size > 6) cache.delete(cache.keys().next().value);
    return entry;
  }

  async function show(src) {
    wantedSrc = src;
    if (src === shownSrc) return;
    await preload(src).ready;
    if (wantedSrc !== src) return; // une autre image a été demandée entre-temps
    const back = layers[1 - front];
    back.src = src;
    back.classList.add('visible');
    layers[front].classList.remove('visible');
    front = 1 - front;
    shownSrc = src;
    hint.style.display = 'none';
  }

  function apply(s) {
    // Une présentation est pilotée depuis le PC maître : l'écran bascule dessus
    if (s.mode === 'deck' && s.deck) return location.replace(s.deck.url);
    document.body.classList.toggle('no-fade', s.transition === 'none');
    msg.textContent = s.message || '';
    msg.style.display = s.message ? 'block' : 'none';
    if (!s.images.length) {
      hint.style.display = 'flex';
      hint.firstChild.textContent = 'Aucune image dans le dossier « images » du PC maître';
      return;
    }
    show(s.images[s.index]);
    preload(s.images[s.next]); // l'image suivante est prête avant le changement
  }

  function connect() {
    const es = new EventSource('/events?role=screen');
    es.onopen = () => { status.style.display = 'none'; };
    es.onmessage = (e) => apply(JSON.parse(e.data));
    es.addEventListener('reload', () => location.reload());
    es.onerror = () => { status.style.display = 'block'; };
  }
  connect();

  // Plein écran au clic / à une touche (les navigateurs exigent une action utilisateur)
  const fs = () => { if (!document.fullscreenElement) document.documentElement.requestFullscreen?.().catch(() => {}); };
  document.addEventListener('click', fs);
  document.addEventListener('keydown', (e) => { if (e.key !== 'F11') fs(); });

  // Empêche la mise en veille de l'écran (si supporté)
  async function wake() {
    try { await navigator.wakeLock?.request('screen'); } catch {}
  }
  wake();
  document.addEventListener('visibilitychange', () => { if (!document.hidden) wake(); });
})();
</script>
</body>
</html>
